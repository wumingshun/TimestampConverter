<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unix时间戳转换器</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:380px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
    .container{background:white;padding:20px}
    .header{text-align:center;margin-bottom:20px}
    .header h1{font-size:20px;color:#333;font-weight:600}
    .toggle-section{background:#f8f9fa;padding:15px 18px;border-radius:12px;margin-bottom:20px}
    .toggle-item{display:flex;align-items:center;justify-content:space-between}
    .toggle-info{flex:1}
    .toggle-label{display:block;font-size:14px;color:#333;font-weight:500;margin-bottom:4px}
    .toggle-desc{display:block;font-size:12px;color:#999}
    .toggle-switch{position:relative;width:50px;height:26px;margin-left:15px}
    .toggle-switch input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:26px}
    .toggle-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%}
    .toggle-switch input:checked+.toggle-slider{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
    .toggle-switch input:checked+.toggle-slider:before{transform:translateX(24px)}
    .domain-info{margin-top:12px;padding-top:12px;border-top:1px solid #e9ecef;font-size:12px}
    .domain-value{color:#667eea;font-family:monospace}
    .converter-section{background:#f8f9fa;padding:20px;border-radius:12px;margin-bottom:20px}
    .input-group{margin-bottom:15px}
    .input-group label{display:block;font-size:14px;color:#666;margin-bottom:8px;font-weight:500}
    .input-group input{width:100%;padding:12px 14px;border:2px solid #e9ecef;border-radius:8px;font-size:16px;font-family:monospace}
    .input-group input:focus{outline:none;border-color:#667eea}
    .input-group .hint{font-size:12px;color:#999;margin-top:6px}
    .result-group{background:white;padding:15px;border-radius:8px;margin-bottom:15px;border-left:4px solid #667eea;display:none}
    .result-group label{display:block;font-size:12px;color:#999;margin-bottom:6px}
    .result-value{font-size:22px;font-weight:600;color:#333;margin-bottom:6px;font-family:monospace}
    .result-type{font-size:12px;color:#667eea;font-weight:500}
    .convert-btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer}
    .quick-section{background:#f8f9fa;padding:15px;border-radius:12px}
    .quick-item{display:flex;align-items:center;padding:12px;background:white;border-radius:8px;margin-bottom:10px}
    .quick-item:last-child{margin-bottom:0}
    .quick-label{flex:1;font-size:13px;color:#666}
    .quick-value{flex:2;font-family:monospace;font-size:14px;color:#333;text-align:right;margin-right:12px}
    .copy-btn{padding:6px 12px;background:#667eea;color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer}
    .footer{text-align:center;margin-top:20px;padding-top:15px;border-top:1px solid #e9ecef}
    .footer p{font-size:12px;color:#999}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🕐 Unix时间戳转换器</h1>
    </div>

    <div class="toggle-section">
      <div class="toggle-item">
        <div class="toggle-info">
          <span class="toggle-label">当前页面自动扫描</span>
          <span class="toggle-desc">自动转换页面中的时间戳</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="auto-scan-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="domain-info" id="domain-info" style="display: none;">
        <span class="domain-label">当前域名: </span>
        <span class="domain-value" id="current-domain">-</span>
      </div>
    </div>

    <div class="converter-section">
      <div class="input-group">
        <label for="timestamp-input">输入Unix时间戳</label>
        <input
          type="text"
          id="timestamp-input"
          placeholder="例如: 1704067200"
          autocomplete="off"
        >
        <p class="hint">支持秒、毫秒、微秒、纳秒级时间戳</p>
      </div>

      <div class="result-group" id="result-group" style="display: none;">
        <label>转换结果（东八区）</label>
        <div class="result-value" id="result-value">2024-01-01 08:00:00</div>
        <div class="result-type" id="result-type">秒级时间戳</div>
      </div>

      <button class="convert-btn" id="convert-btn" style="display:none">转换</button>
    </div>

    <div class="converter-section">
      <div class="input-group">
        <label for="datetime-input">选择日期时间（东八区）</label>
        <input
          type="datetime-local"
          id="datetime-input"
          step="1"
          autocomplete="off"
        >
        <p class="hint">将可读时间转换为 Unix 秒级时间戳</p>
      </div>

      <div class="result-group" id="reverse-result-group" style="display: none;">
        <label>Unix 时间戳（秒）</label>
        <div class="result-value" id="reverse-result-value">-</div>
        <div class="result-type" id="reverse-result-type">秒级时间戳</div>
      </div>
    </div>

    <div class="quick-section">
      <div class="quick-item">
        <span class="quick-label">当前时间戳（秒）</span>
        <span class="quick-value" id="current-second">-</span>
        <button class="copy-btn" data-target="current-second">复制</button>
      </div>
      <div class="quick-item">
        <span class="quick-label">当前时间戳（毫秒）</span>
        <span class="quick-value" id="current-millisecond">-</span>
        <button class="copy-btn" data-target="current-millisecond">复制</button>
      </div>
    </div>

    <div class="footer">
      <p>选中网页中的时间戳自动转换</p>
    </div>
  </div>

  <script src="popup-init.js"></script>
  <script src="popup.js" async></script>
</body>
</html>
